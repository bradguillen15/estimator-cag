name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is already in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # Job names are the status checks required by the `main` branch protection. Keep them stable.
    name: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (there is no floating `v10`).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Same script as the pre-commit hook. Python comes from .python-version; tests/conftest.py
      # pins fake settings and blocks real LLM calls, so no secrets are needed.
      - run: bash scripts/ci/api.sh
        env:
          CI_COVERAGE: "1"

      # Coveralls merges the api and web reports into one build (see the coverage job).
      - uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage/api.lcov
          flag-name: api
          parallel: true
          # Coverage is informational: a Coveralls outage must never fail a required check.
          fail-on-error: false

  web:
    name: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Same script as the pre-commit hook: lint, Vitest, build (includes type-check).
      - run: bash scripts/ci/web.sh
        env:
          CI_COVERAGE: "1"

      - uses: coverallsapp/github-action@v2.3.8
        with:
          file: web/coverage/lcov.info
          flag-name: web
          parallel: true
          # Coverage is informational: a Coveralls outage must never fail a required check.
          fail-on-error: false

  # Closes the parallel Coveralls build once both suites uploaded. Not a required check.
  coverage:
    name: coverage
    needs: [api, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: coverallsapp/github-action@v2.3.8
        with:
          parallel-finished: true
          carryforward: api,web
          fail-on-error: false
