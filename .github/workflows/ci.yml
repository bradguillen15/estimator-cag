name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is already in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # Job names are the status checks required by the `main` branch protection. Keep them stable.
    name: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (there is no floating `v10`).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Same script as the pre-commit hook. Python comes from .python-version; tests/conftest.py
      # pins fake settings and blocks real LLM calls, so no secrets are needed.
      - run: bash scripts/ci/api.sh
        env:
          CI_COVERAGE: "1"

      # Coveralls merges the api and web reports into one build (see the coverage job).
      - uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage/api.lcov
          flag-name: api
          parallel: true
          # Coverage is informational: a Coveralls outage must never fail a required check.
          fail-on-error: false

      # The coverage job turns both reports into the PR comment (scripts/ci/coverage-summary.sh).
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov-api
          path: coverage/api.lcov
          retention-days: 1

  web:
    name: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Same script as the pre-commit hook: lint, Vitest, build (includes type-check).
      - run: bash scripts/ci/web.sh
        env:
          CI_COVERAGE: "1"

      - uses: coverallsapp/github-action@v2.3.8
        with:
          file: web/coverage/lcov.info
          flag-name: web
          parallel: true
          # Coverage is informational: a Coveralls outage must never fail a required check.
          fail-on-error: false

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov-web
          path: web/coverage/lcov.info
          retention-days: 1

  # Closes the parallel Coveralls build once both suites uploaded, and posts the line coverage as a
  # sticky PR comment and job summary (Coveralls' own PR comments never showed up). Not a required check.
  coverage:
    name: coverage
    needs: [api, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: lcov-*
          path: lcov
        # A failed suite uploads no report; the summary then marks it as missing.
        continue-on-error: true

      - name: Build coverage summary
        run: |
          bash scripts/ci/coverage-summary.sh \
            api=lcov/lcov-api/api.lcov web=lcov/lcov-web/lcov.info > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "Details: [Coveralls](https://coveralls.io/github/${{ github.repository }}) · commit ${{ github.event.pull_request.head.sha || github.sha }}" >> coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Edits the same comment on every push instead of adding a new one.
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          header: coverage
          path: coverage-summary.md

      - uses: coverallsapp/github-action@v2.3.8
        with:
          parallel-finished: true
          carryforward: api,web
          fail-on-error: false
