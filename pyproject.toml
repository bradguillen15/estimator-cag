[project]
name = "estimator-cag"
version = "0.1.0"
description = "Software effort estimator using CAG (Cache-Augmented Generation)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "faker>=40.43.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=3.13.0",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "redisvl>=0.27.2",
    "spacy>=3.8.16",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Third-party deprecation inside Starlette's TestClient; not actionable here.
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
